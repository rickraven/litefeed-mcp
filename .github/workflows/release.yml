# Release pipeline.
#
# Runs when a version tag (v1.2.3) is pushed. The tag must point to a
# commit that belongs to the main branch, otherwise the release is
# rejected. The pipeline:
#   1. runs vet and tests;
#   2. builds static binaries for several platforms and publishes them,
#      with SHA-256 checksums, as a GitHub release;
#   3. builds a multi-platform Docker image and pushes it to Docker Hub.
#
# Required repository secrets:
#   DOCKERHUB_LOGIN     Docker Hub user name
#   DOCKERHUB_TOKEN     Docker Hub access token with write access
# Optional repository variable:
#   DOCKERHUB_IMAGE     image name, default "<DOCKERHUB_LOGIN>/litefeed-mcp"

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check that the tag is on main
        run: |
          commit="$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$commit" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} points to ${commit}, which is not on the main branch"
            exit 1
          fi

      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Vet
        working-directory: src
        run: go vet ./...

      - name: Test
        working-directory: src
        run: go test ./...

  binaries:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }}
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: linux, goarch: arm, goarm: "7" }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: freebsd, goarch: amd64 }
          - { goos: freebsd, goarch: arm64 }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.sum

      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          arch="${GOARCH}${GOARM:+v${GOARM}}"
          name="litefeed-mcp_${VERSION}_${GOOS}_${arch}"
          bin="litefeed-mcp"
          [ "$GOOS" = windows ] && bin="litefeed-mcp.exe"

          mkdir -p "dist/${name}"
          (cd src && go build -trimpath -ldflags="-s -w -X main.version=${VERSION}" -o "../dist/${name}/${bin}" .)
          cp README.md config.example.yaml "dist/${name}/"

          cd dist
          if [ "$GOOS" = windows ]; then
            zip -qr "${name}.zip" "${name}"
          else
            tar -czf "${name}.tar.gz" "${name}"
          fi
          rm -rf "${name}"

      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm }}
          path: dist/*
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub release
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum -- * > checksums.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag

  docker:
    name: Publish Docker image
    needs: verify
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ vars.DOCKERHUB_IMAGE || format('{0}/litefeed-mcp', secrets.DOCKERHUB_LOGIN) }}
    steps:
      - uses: actions/checkout@v7

      # QEMU is needed for the RUN steps of the runtime stage on foreign
      # platforms; the Go build itself is cross-compiled natively.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_LOGIN }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref_name, 'v0.') }}
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          build-args: |
            VERSION=${{ github.ref_name }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
